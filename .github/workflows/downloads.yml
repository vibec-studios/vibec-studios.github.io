# Download-Center aktuell halten: liest die GitHub-Releases aller Mods, lässt neue Dateien von VirusTotal prüfen
# und committet data/downloads.json. Dazu der Vibe Store für den Vibe Launcher: data/store.json (eine Version je Jar,
# Minecraft-Versionen/Loader aus den Jar-Metadaten) samt data/store-cache.json, damit jede Jar nur einmal geladen wird.
# Läuft alle 6 Stunden, nach Änderungen an den Skripten und auf Knopfdruck
# (Actions → Downloads aktualisieren → Run workflow). Den API-Key liefert das Repo-Secret VT_API_KEY.
name: Downloads aktualisieren

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/downloads.py', 'tools/store.py', 'js/content/**', '.github/workflows/downloads.yml']

permissions:
  contents: write
  pages: write

concurrency:
  group: downloads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Immer den neuesten Stand von main holen (nicht den auslösenden Commit): so baut ein Lauf, der in der
      # Warteschlange stand, auf den Scans des vorherigen Laufs auf und kommt ihm beim Pushen nicht in die Quere.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Releases und VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/downloads.py

      # Ein Fehler hier hält die Downloads nicht auf; der Store bleibt dann auf dem letzten Stand
      - name: Vibe Store
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/store.py

      - name: Committen und Seite neu bauen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/downloads.json data/store.json data/store-cache.json && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "Keine Änderung"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/downloads.json $(ls data/store.json data/store-cache.json 2>/dev/null)
          git commit -m "Update downloads"
          # Hat jemand dazwischen gepusht: die frisch erzeugten Dateien gewinnen (beim Rebase ist das „theirs“)
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
